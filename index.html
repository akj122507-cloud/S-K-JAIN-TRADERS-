<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S K Jain Traders | Building Material Supplier</title>

<meta name="description" content="S K Jain Traders - Building Material Supplier in Bhopura, Sahibabad, Ghaziabad. Cement, Ret, Bajri, Eent, Tiles, Wholesale, Retail and Delivery.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f6f8fb;
color:#111827;
line-height:1.6;
}

header{
background:#0f172a;
color:#fff;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.nav{
max-width:1200px;
margin:auto;
padding:17px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:25px;
font-weight:800;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:22px;
font-weight:600;
}

.hero{
background:linear-gradient(135deg,#0f172a,#334155);
color:#fff;
padding:85px 20px;
}

.hero-inner{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1.2fr .8fr;
gap:40px;
align-items:center;
}

.badge{
display:inline-block;
background:#dcfce7;
color:#15803d;
padding:7px 14px;
border-radius:30px;
font-weight:bold;
margin-bottom:18px;
}

.hero h1{
font-size:clamp(42px,7vw,70px);
line-height:1.05;
margin-bottom:22px;
}

.hero p{
font-size:20px;
color:#dbe4ef;
max-width:720px;
margin-bottom:28px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
}

.btn{
display:inline-block;
padding:14px 21px;
border-radius:10px;
text-decoration:none;
font-weight:800;
border:none;
cursor:pointer;
}

.btn-call{
background:#fff;
color:#0f172a;
}

.btn-whatsapp{
background:#16a34a;
color:#fff;
}

.btn-quote{
background:#f59e0b;
color:#111827;
}

.btn-map{
background:#e5e7eb;
color:#111827;
}

.hero-card{
background:#1e293b;
border:1px solid #475569;
border-radius:22px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.hero-card h2{
margin-bottom:18px;
font-size:27px;
}

.hero-card p{
font-size:16px;
margin:9px 0;
color:#e2e8f0;
}

section{
padding:70px 20px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:40px;
}

.products{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:18px;
}

.product{
background:#fff;
border:1px solid #e5e7eb;
border-radius:18px;
padding:25px 15px;
text-align:center;
box-shadow:0 7px 25px rgba(0,0,0,.06);
transition:.2s;
}

.product:hover{
transform:translateY(-5px);
}

.icon{
font-size:42px;
margin-bottom:10px;
}

.product h3{
font-size:21px;
margin-bottom:7px;
}

.product p{
font-size:14px;
color:#64748b;
}

.services{
background:#0f172a;
color:#fff;
}

.services .title{
color:#fff;
}

.service-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.service{
background:#1e293b;
border:1px solid #334155;
border-radius:18px;
padding:30px;
}

.service h3{
font-size:22px;
margin-bottom:10px;
}

.service p{
color:#cbd5e1;
}

.enquiry{
background:#eef2ff;
}

.enquiry-box{
background:#fff;
border-radius:22px;
padding:35px;
text-align:center;
box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.enquiry-box p{
max-width:700px;
margin:0 auto 25px;
color:#64748b;
font-size:18px;
}

.contact{
background:#e2e8f0;
}

.contact-box{
max-width:850px;
margin:auto;
background:#0f172a;
color:#fff;
padding:35px;
border-radius:22px;
}

.contact-row{
padding:18px 0;
border-bottom:1px solid #334155;
}

.contact-row:last-child{
border-bottom:none;
}

.contact-label{
color:#94a3b8;
font-weight:bold;
margin-bottom:5px;
}

.contact-row a{
color:#fff;
text-decoration:none;
font-size:19px;
}

.address{
font-size:18px;
color:#e2e8f0;
}

footer{
background:#020617;
color:#94a3b8;
text-align:center;
padding:30px 20px;
}

footer strong{
color:#fff;
font-size:20px;
}

@media(max-width:900px){

.hero-inner{
grid-template-columns:1fr;
}

.products{
grid-template-columns:repeat(2,1fr);
}

.service-grid{
grid-template-columns:1fr;
}

nav{
display:none;
}

}

@media(max-width:500px){

section{
padding:55px 15px;
}

.hero{
padding:60px 15px;
}

.hero h1{
font-size:40px;
}
